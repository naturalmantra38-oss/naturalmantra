<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#1E3F20"/>
    </linearGradient>
  </defs>

  <!-- Leaf & Mantra Emblem -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="55" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <path d="M50 18 C30 35, 20 65, 50 92 C80 65, 70 35, 50 18 Z" fill="url(#greenGrad)" />
    <path d="M50 25 C62 42, 60 62, 50 82" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="55" r="5" fill="#D4AF37"/>
  </g>

  <!-- Brand Typography -->
  <text x="125" y="58" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#1E3F20" letter-spacing="1">NATURAL MANTRA</text>
  <text x="127" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#C5A059" letter-spacing="3.5">PURE • AUTHENTIC • ORGANIC</text>

  <!-- Hindi Tagline -->
  <text x="127" y="104" font-family="system-ui, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#2D5A27" letter-spacing="0.5">जिएं प्रकृति के मंत्र के साथ</text>
</svg>
